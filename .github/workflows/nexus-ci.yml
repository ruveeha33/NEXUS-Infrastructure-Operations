name: NEXUS Infrastructure CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nexus-tests:
    name: NEXUS Python 3.14
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-nexus.txt

      - name: Install NEXUS dependencies
        run: |
          python -m pip install -r requirements-nexus.txt

      - name: Compile NEXUS source
        run: |
          python -m compileall -q nexus_ui

      - name: Validate launcher
        run: |
          bash -n nexus

      - name: Run NEXUS regression suite
        env:
          PYTHONPATH: .
          TERM: xterm-256color
        run: |
          python -m pytest tests/nexus -q

      - name: Verify repository security boundaries
        run: |
          test -f pytest.ini
          test -f requirements-nexus.txt
          test -f nexus_ui/app.py
          test -f scripts/ops.sh

          if find nexus_ui tests -type f \
            -name '*.backup_*' | grep -q .; then
            echo "ERROR: Local backup detected"
            exit 1
          fi

          echo "NEXUS repository checks passed."
