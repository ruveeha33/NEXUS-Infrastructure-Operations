<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Operations Lab</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #090e17;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
    display: grid;
    place-items: center;
}
main {
    width: min(850px, 90%);
    border: 1px solid #263447;
    padding: 50px;
    border-radius: 12px;
    background: #101722;
}
.label {
    color: #38bdf8;
    font-size: 12px;
    letter-spacing: 3px;
}
h1 { font-size: 42px; }
p { color: #94a3b8; line-height: 1.8; }
.status {
    color: #4ade80;
    padding: 15px 0;
    border-top: 1px solid #263447;
}
footer {
    margin-top: 30px;
    color: #64748b;
    font-size: 12px;
}
</style>
</head>
<body>
<main>
    <div class="label">DECODELABS / DEVOPS / 01</div>
    <h1>Linux Operations Lab</h1>
    <p>
        A Linux-based web application environment
        demonstrating filesystem engineering,
        configuration management, logging,
        security and operational automation.
    </p>
    <div class="status">SYSTEM INITIALIZED</div>
    <footer>DEVOPS INDUSTRIAL TRAINING | PROJECT 01</footer>
</main>
</body>
</html>
